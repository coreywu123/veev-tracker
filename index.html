/* Layout idea: one ledger grid used everywhere. Dashboard = work queue by task, then the same per-home table. Detail = stacked label/value sections. */
:root{
  --mint:#A6F5AE; --seafoam:#CAF2CE; --ice:#E7E9EC; --cloud:#F7F8F8; --frost:#DFEAE0;

  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cloud);color:var(--charcoal);font-family:var(--body);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
header{background:var(--charcoal);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:18px;letter-spacing:.14em;font-weight:700}
.brand span{color:var(--sand);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;margin-top:10px;overflow-x:auto}
nav a{color:var(--sand);text-decoration:none;padding:9px 14px 10px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:#fff;border-bottom-color:var(--mint)}
main{max-width:1320px;margin:0 auto;padding:14px 16px 80px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chipbtn{border:1px solid var(--sand);background:#fff;padding:6px 11px;border-radius:2px;font-size:13px;font-weight:500;cursor:pointer}
.chipbtn.on{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--sand);border:1px solid var(--sand);margin-bottom:6px}
.tile{background:#fff;padding:9px 10px}
.tile i{display:block;font-style:normal;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--slate)}
.tile b{font-size:19px;font-weight:600}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);margin:24px 0 6px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}

.q{background:#fff;border-top:2px solid var(--charcoal)}
.qh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;background:var(--frost)}
.qh.now{background:var(--charcoal);color:#fff}
.ql{display:grid;grid-template-columns:minmax(150px,34%) 1fr;gap:4px 14px;padding:9px 10px;border-bottom:1px solid var(--ice)}
.ql b{font-weight:600}
.ql span a{white-space:nowrap;margin-right:10px}
.clear{padding:10px;background:var(--seafoam);font-weight:600}
.quiet{padding:9px 10px;color:var(--graphite);background:#fff;border-bottom:1px solid var(--ice)}
.tw{overflow-x:auto;background:#fff;border-top:2px solid var(--charcoal)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--slate);text-align:left;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--sand);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--ice);vertical-align:top}
td.r,th.r{text-align:right}
tr[data-go]{cursor:pointer}
tr[data-go]:hover td{background:var(--frost)}
tr.grp td{background:var(--ice);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px}
td .sm{display:block;font-size:12px;color:var(--graphite)}
.st{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:2px;white-space:nowrap}
.st.Listed{background:var(--mint)} .st.Sold{background:var(--charcoal);color:#fff} .st.Closed{background:var(--slate);color:#fff}
.st.Planned,.st.Built{border:1px solid var(--sand);color:var(--graphite)} .st.Pulled{background:var(--warn-bg);color:var(--warn)}
.over{color:var(--bad);font-weight:600} .under{color:var(--good);font-weight:600} .mute{color:var(--slate)}

form.grid label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);display:flex;flex-direction:column;gap:3px}
form.grid .wide{grid-column:1/-1}

.gates{background:#fff;display:grid;grid-template-columns:1fr 1fr}
.gate{display:flex;gap:9px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--ice)}

input[type=checkbox]{width:18px;height:18px;flex:none;padding:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.note p{margin:0;flex:1}
.note time{font-size:11px;color:var(--slate);white-space:nowrap}

.x{border:0;background:none;color:var(--slate);cursor:pointer;font-size:16px;padding:0 4px}

function salesStatus(){const docs=S.sales.filter(d=>(d.rows||[]).length);const all=allSales();if(!docs.length)return `<div class="quiet">No sales file imported yet. Download sold-homes lists from Redfin (Sold, last 6 months, House, then Download), choose the files above and click Import.</div>`;

    `<div class="tw" style="margin-top:8px"><table style="min-width:0"><tr><th>ZIP</th><th class="r">Sales in window</th><th>Newest sale</th><th>Oldest sale</th><th>File last imported</th></tr>`+Object.keys(byZ).sort().map(z=>{const d=S.sales.find(x=>x.id===z)||{};return `<tr><td class="num"><b>${esc(z)}</b></td><td class="r num">${byZ[z].length}</td><td class="num">${fmt(Math.max(...byZ[z]))}</td><td class="num">${fmt(Math.min(...byZ[z]))}</td><td class="num">${d.updated?new Date(d.updated).toLocaleDateString("en-US",{month:"short",day:"numeric"}):"–"}</td></tr>`;}).join("")+`</table></div>`;}
function viewComps(){

function renderInner(){nav();const r=route();let o;
  if(S.needLogin){$("nav").innerHTML="";$("app").innerHTML=viewLogin();return;}
  if(!S.ready)o=banner()+`<div class="quiet">Loading homes…</div>`;
  else if(r==="data")o=viewData();
  else if(r.startsWith("home-"))o=viewHome(r.slice(5));
  else if(r==="homes")o=viewHomes(); else if(r==="comps")o=viewComps(); else if(r==="escrow")o=viewEscrow(); else if(r==="browse"||r==="homes"||r==="areas"||r==="map"||r==="escrow"||r==="pge")o=viewBrowse(); else if(r==="areas")o=viewAreas(); else o=viewDashboard();

document.addEventListener("change",async e=>{const t=e.target;if(!t.dataset||!S.db||!(t.dataset.ptier||t.dataset.pavoid))return;const mk=t.dataset.mk,mt=hoodMeta(mk);const pt=Object.assign({},mt.pt||{}),pa=Object.assign({},mt.pa||{});

let SUGT=0,SUGN=0,SUGL=[];
const suggBox=()=>document.getElementById("q-sugg");const suggHide=()=>{const b=suggBox();if(b){b.hidden=true;b.innerHTML="";}SUGL=[];};
async function suggFetch(q){const n=++SUGN;try{const r=await fetch("https://photon.komoot.io/api/?limit=7&lang=en&lat=37.30&lon=-121.90&bbox=-122.65,36.95,-121.45,38.15&q="+encodeURIComponent(q));if(!r.ok)return;const j=await r.json();if(n!==SUGN)return;const seen={};SUGL=((j&&j.features)||[]).map(ft=>{const p=ft.properties||{},c=(ft.geometry||{}).coordinates||[];const road=[p.housenumber,p.street||(p.housenumber?"":p.name)].filter(Boolean).join(" ")||p.name||"";return {road,city:p.city||p.town||p.village||p.district||"",zip:String(p.postcode||"").slice(0,5),county:p.county||"",lat:+(+c[1]).toFixed(6),lng:+(+c[0]).toFixed(6),house:!!p.housenumber};}).filter(x=>x.road&&x.lat&&x.lng&&!seen[x.road+x.zip]&&(seen[x.road+x.zip]=1)).sort((a,b)=>(b.house?1:0)-(a.house?1:0));const b=suggBox();if(!b)return;if(!SUGL.length){suggHide();return;}b.innerHTML=SUGL.map((x,i)=>`<div data-sugg="${i}"><b>${esc(x.road)}</b><small>${esc([x.city,x.zip].filter(Boolean).join(" "))}${x.house?"":" · street only, no house number match"}</small></div>`).join("");b.hidden=false;}catch(_){ }}
function suggPick(i){const x=SUGL[i];if(!x)return;const q=[x.road,x.city].filter(Boolean).join(", ");const g={lat:x.lat,lng:x.lng,zip:x.zip,city:x.city,county:x.county,road:x.road,label:q,q};g.market=marketOf(g);g.region=regionOf(g);S.found=g;suggHide();render();}
document.addEventListener("input",e=>{const t=e.target;if(!t||t.id!=="q-addr")return;clearTimeout(SUGT);const q=t.value.trim();if(q.length<4){suggHide();return;}SUGT=setTimeout(()=>suggFetch(q),260);});
document.addEventListener("mousedown",e=>{const d=e.target.closest&&e.target.closest("[data-sugg]");if(d){e.preventDefault();suggPick(+d.dataset.sugg);return;}if(!(e.target.closest&&e.target.closest("#searchForm")))suggHide();});
document.addEventListener("keydown",e=>{if(!e.target||e.target.id!=="q-addr")return;const b=suggBox();if(!b||b.hidden)return;const items=[...b.children];let k=items.findIndex(x=>x.classList.contains("on"));if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(k>=0)items[k].classList.remove("on");k=e.key==="ArrowDown"?(k+1)%items.length:(k<=0?items.length-1:k-1);items[k].classList.add("on");}else if(e.key==="Enter"&&k>=0){e.preventDefault();suggPick(k);}else if(e.key==="Escape"){suggHide();}});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="loginForm"){const fd0=new FormData(f);S.msg="";const {error}=await S.sb.auth.signInWithPassword({email:fd0.get("email"),password:fd0.get("password")});if(error){S.msg="That email and password didn't work.";render();}else{S.needLogin=false;S.msg="";start();}return;}
  if(f.id==="lotForm"){if(S.found){const fd=new FormData(f);S.found.lot=String(fd.get("lot")||"").replace(/[^0-9.]/g,"");const [w,p]=String(fd.get("why")||"").split("|");const cp=parseFloat(String(fd.get("pct")||"").replace(/[^0-9.+-]/g,""));S.found.premWhy=w||(isNaN(cp)?"":"Custom");S.found.prem=!isNaN(cp)?Math.max(-30,Math.min(30,cp)):(Number(p)||0);if(S.found.premWhy==="Custom"&&isNaN(cp)){S.found.premWhy="";S.found.prem=0;}render();}return;}
  if(f.id==="searchForm"){const q=String(new FormData(f).get("q")||"").trim();if(!q){S.found=null;render();return;}S.found={q,busy:true};render();
    try{const g=await geocode(q);if(!g)S.found={q,err:"Couldn't find that address. Add the city and try again."};else{g.q=q;g.market=marketOf(g);g.region=regionOf(g);S.found=g;}}catch(err){S.found={q,err:"Address lookup isn't responding right now. "+(err.message||"")};}
    render();return;}
  if(!S.db){fail();return;}
  if(f.id==="importForm"){try{let txt=$("imp").value.trim();const fl=$("impFile").files[0];if(!txt&&fl)txt=await fl.text();const d=JSON.parse(txt);let rows=[];["homes","notes","comps","areas","shapes","hoods","meta"].forEach(c=>(d[c]||[]).forEach(x=>{const o=Object.assign({},x);const id=String(o.id||"");delete o.id;if(id)rows.push({coll:c,id,data:o});}));
      for(let i=0;i<rows.length;i+=100){const {error}=await S.sb.from("docs").upsert(rows.slice(i,i+100));if(error)throw error;}
      await S.db.reloadAll();S.msg="Imported "+rows.length+" records.";}catch(err){S.msg="Import failed: "+(err.message||err);}render();return;}const v=Object.fromEntries(new FormData(f).entries());
  try{
    if(f.id==="noteForm"){if(!v.text.trim())return;await S.db.collection("notes").add({home:f.dataset.id,kind:v.kind,text:v.text.trim(),date:today(),done:false});f.reset();S.msg="";}
    if(f.id==="editForm"){const u={status:v.status,flags:v.flags,zip:v.zip,elem:v.elem,high:v.high,listNote:v.listNote,hc:v.hc,saleDate:v.saleDate,closeDate:v.closeDate};
      ["list","sale","incAct","model"].forEach(key=>u[key]=n(v[key]));u.net=u.sale?u.sale-(u.incAct||0):null;
      await S.db.doc("homes/"+f.dataset.id).update(u);S.edit=false;S.msg="Saved.";render();}
    if(f.id==="areaForm"){const id=slug(v.city+"-"+v.name);const sp=x=>x.split(",").map(q=>q.trim()).filter(Boolean);
      await S.db.doc("areas/"+id).set({city:v.city.trim(),name:v.name.trim(),zips:sp(v.zips),streets:sp(v.streets),schools:v.schools.trim(),tier:Number(v.tier),model:n(v.model),note:v.note.trim()});S.city=v.city.trim();S.area=id;S.addArea=false;render();}
    if(f.id==="pxForm"){const h=homeById(f.dataset.id);const amt=n(v.v);if(!amt)return;const u={px:[...(h.px||[]),{t:v.t,v:amt,d:v.d}]};const key={"Quarterly refresh":"qr","Green Folder":"gf","AOP":"aop","List price":"list","Lot price":"acq"}[v.t];if(key)u[key]=amt;await S.db.doc("homes/"+f.dataset.id).update(u);S.msg="Price logged.";render();}
    if(f.id==="buildForm"){const b={},dn={};STAGES.forEach(([k])=>{b[k]=v["d_"+k]||"";dn[k]=!!v["c_"+k];});const u={build:b,bd:dn,cm:v.cm,pid:v.pid};if(b.hc)u.hc=b.hc;await S.db.doc("homes/"+f.dataset.id).update(u);S.msg="Build saved.";render();}
    if(f.id==="mktForm"){const c={};CH.forEach(([k])=>c[k]=!!v["ch_"+k]);const u={mktDate:v.mktDate,ch:c,mktPlan:v.mktPlan,listNote:v.listNote};if(n(v.list))u.list=n(v.list);await S.db.doc("homes/"+f.dataset.id).update(u);S.msg="Marketing saved.";render();}
    if(f.id==="escNoteForm"){if(!v.text.trim())return;await S.db.collection("notes").add({home:f.dataset.id,kind:"esc",text:v.text.trim(),date:today(),done:false});f.reset();}
    if(f.id==="hoodForm"){const name=f.dataset.name;await S.db.doc("hoods/"+slug(name)).set({name,avoid:!!v.avoid,note:(v.note||"").trim(),pt:hoodMeta(name).pt||{},pa:hoodMeta(name).pa||{},updated:today()});S.msg="Saved.";render();}
    if(f.id==="lotModelForm"){const b=parseFloat(v.beta);await S.db.doc("meta/lot").set({beta:isNaN(b)?null:b,updated:today()});LOTC=null;S.msg="";render();}
    if(f.id==="avoidForm"){const mt=avMeta();const zs=[...(mt.zips||[])],hs=[...(mt.hoods||[])];const z=(v.zip||"").trim().slice(0,5),h=(v.hood||"").trim();let bad="";if(z){if(ZIPS.some(q=>q.zip===z)){if(!zs.includes(z))zs.push(z);}else bad="ZIP "+z+" is outside the mapped area. ";}if(h){const c=CITY.find(q=>q.name.toLowerCase()===h.toLowerCase());if(c){if(!hs.includes(c.name))hs.push(c.name);}else bad+="No city neighborhood named "+h+". Pick one from the list.";}await S.db.doc("meta/avoid").set({zips:zs,hoods:hs,updated:today()});S.msg=bad;render();}
    if(f.id==="homeLotForm"){const [w,p]=String(v.why||"").split("|");const cp=parseFloat(String(v.pct||"").replace(/[^0-9.+-]/g,""));let why=w||(isNaN(cp)?"":"Custom"),prem=!isNaN(cp)?Math.max(-30,Math.min(30,cp)):(Number(p)||0);if(why==="Custom"&&isNaN(cp)){why="";prem=0;}const lot=n(String(v.lot||"").replace(/[^0-9.]/g,""))||null;await S.db.doc("homes/"+f.dataset.id).update({lot,lotPrem:prem,lotPremWhy:why});S.msg="";render();}
    if(f.id==="shapeForm"){const d={name:v.name.trim(),kind:v.kind,tier:Number(v.tier),note:v.note.trim()};if(S.newShape){await S.db.collection("shapes").add(Object.assign(d,{pts:S.newShape.pts,city:S.newShape.city}));S.newShape=null;}else{await S.db.doc("shapes/"+f.dataset.id).update(d);}S.shape="";render();}
    if(f.id==="homeForm"){const id=slug(v.address);if(!id)return;if(homeById(id)){S.msg="That address is already in the tracker.";render();return;}
      await S.db.doc("homes/"+id).set({region:v.region,address:v.address.trim(),city:v.city.trim(),hood:v.hood.trim(),zip:v.zip.trim(),plan:v.plan,elv:(v.plan==="E"?"Model E":v.plan+" "+v.elv.trim()).trim(),status:v.status,hc:v.hc,lot:n(v.lot),gf:n(v.gf),aop:n(v.aop),acq:n(v.acq),acqDate:v.acqDate,build:{hc:v.hc||""}});
      geocode(v.address.trim()+", "+v.city.trim()+", CA").then(g=>{if(g)S.db.doc("homes/"+id).update({lat:g.lat,lng:g.lng,zip:v.zip.trim()||g.zip,hood:v.hood.trim()||marketOf(g)});}).catch(()=>{});S.addHome=false;S.msg="Home added.";render();}
    if(f.id==="escForm"){const coe=v.coe;delete v.coe;await S.db.doc("homes/"+f.dataset.id).update({coe:coe,esc:v});S.escEdit=false;S.msg="Escrow saved.";render();}
    if(f.id==="compForm"){const id=f.dataset.id,old=id?S.comps.find(x=>x.id===id):null,pre=S.compPre||{};
      const c={address:v.address.trim(),hood:v.hood,builder:v.builder.trim(),status:v.status,price:n(v.price),sf:n(v.sf),adj:parseFloat(v.adj)||0,adjWhy:v.adjWhy.trim(),lot:n(v.lot),date:v.date,dom:n(v.dom),near:v.near,note:v.note.trim()};
      if(!old){c.added=today();if(pre.lat){c.lat=pre.lat;c.lng=pre.lng;c.zip=pre.zip;}}
      if(!(old&&old.lat&&old.address===c.address)&&!c.lat){try{const g=await geocode(c.address+(/,/.test(c.address)?"":", San Jose, CA"));if(g){c.lat=g.lat;c.lng=g.lng;c.zip=g.zip;}}catch(_){ }}
      if(old)await S.db.doc("comps/"+id).update(c);else await S.db.collection("comps").add(c);
      S.addComp=false;S.compEdit="";S.compPre=null;S.msg="Comp saved."+(c.lat||(old&&old.lat)?"":" Couldn't place it on the map; check the address.");render();}
  }catch(err){fail(err);}

function deep(a,b){const o=Object.assign({},a);for(const k in b){const v=b[k];o[k]=(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))?deep(o[k],v):v;}return o;}
function mkdb(sb){const subs={};
  const load=async c=>{const {data,error}=await sb.from("docs").select("id,data").eq("coll",c);if(error)throw error;return {docs:data.map(r=>({id:r.id,data:()=>r.data}))};};
  const emit=async c=>{const s=subs[c];if(!s)return;try{s.cb(await load(c));}catch(e){s.err&&s.err(e);}};
  const put=async(c,id,data)=>{const {error}=await sb.from("docs").upsert({coll:c,id,data,updated_at:new Date().toISOString()});if(error)throw error;await emit(c);};
  const cur=(c,id)=>{const x=(S[c]||[]).find(q=>q.id===id);if(!x)return {};const o=Object.assign({},x);delete o.id;return o;};
  return {collection:c=>({onSnapshot:(cb,err)=>{subs[c]={cb,err};emit(c);},add:d=>put(c,(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/-/g,"").slice(0,14),d)}),
    doc:p=>{const k=p.indexOf("/"),c=p.slice(0,k),id=p.slice(k+1);return {set:d=>put(c,id,d),update:u=>put(c,id,deep(cur(c,id),u)),delete:async()=>{const {error}=await sb.from("docs").delete().eq("coll",c).eq("id",id);if(error)throw error;await emit(c);}};},
    reloadAll:()=>Promise.all(Object.keys(subs).map(emit))};}
function start(){S.ready=false;render();const db=mkdb(S.sb);S.db=db;let got=0;
  const sub=name=>db.collection(name).onSnapshot(s=>{S[name]=s.docs.map(x=>Object.assign({},x.data(),{id:x.id}));if(++got>=8)S.ready=true;S.err="";soft();},err=>{S.ready=true;S.err="Can't reach the data: "+(err.message||err)+". If this is the first run, the SQL setup script hasn't been run yet.";render();});
  ["homes","notes","comps","areas","shapes","hoods","sales","meta"].forEach(sub);}
(async()=>{
