*{box-sizing:border-box}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}

.q{background:#fff;border-top:2px solid var(--charcoal)}

.qh.now{background:var(--charcoal);color:#fff}

.ql b{font-weight:600}
.ql span a{white-space:nowrap;margin-right:10px}
.clear{padding:10px;background:var(--seafoam);font-weight:600}
.quiet{padding:9px 10px;color:var(--graphite);background:#fff;border-bottom:1px solid var(--ice)}
.tw{overflow-x:auto;background:#fff;border-top:2px solid var(--charcoal)}

    try{await S.db.doc("homes/"+id).set({region:F.region,address:addr,city:F.city,hood:F.market,zip:F.zip,plan:"X",elv:"X",status:"Planned",lat:F.lat,lng:F.lng,model:st?r10(st.val):zm?r10(zm):null,build:{}});S.found=null;location.hash="home-"+id;}catch(err){fail(err);}return;}
  if(t.dataset.act==="starter"){try{for(const [name,tier,pts] of STARTER){if(!S.shapes.some(x=>x.name===name))await S.db.doc("shapes/starter-"+slug(name)).set({name,kind:"hood",tier,city:"San Jose",pts,starter:true,note:"Approximate starter boundary. Drag the corners to fix it."});}}catch(err){fail(err);}render();return;}
  if(t.dataset.act==="locate-comps"){const todo=S.comps.filter(c=>!c.lat);let ok=0;for(const c of todo){S.msg="Locating "+c.address+"…";render();try{const g=await geocode(c.address+(/san jose|,/i.test(c.address)?"":", San Jose, CA"));if(g){ok++;await S.db.doc("comps/"+c.id).update({lat:g.lat,lng:g.lng,zip:g.zip});}}catch(_){ }await sleep(1100);}S.msg="Placed "+ok+" of "+todo.length+" on the map.";render();return;}
  if(t.dataset.shape){S.shape=t.dataset.shape;S.newShape=null;render();return;}
  if(t.dataset.act==="shape-cancel"){S.shape="";S.newShape=null;render();return;}
  if(t.dataset.act==="signout"){await S.sb.auth.signOut();location.reload();return;}
  if(t.dataset.act==="backup"){const blob=new Blob([JSON.stringify({homes:S.homes,notes:S.notes,comps:S.comps,areas:S.areas,shapes:S.shapes,hoods:S.hoods})],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="veev-tracker-backup-"+today()+".json";document.body.appendChild(a);a.click();a.remove();return;}
  if(t.dataset.b!=null){const [k,v]=[t.dataset.b[0],t.dataset.b.slice(2)];if(k==="r"){S.bRegion=v;S.bCity="";}if(k==="c"){S.bCity=v;S.bTab="inv";}if(k==="t")S.bTab=v;S.addHome=false;S.area="";if(route()!=="browse")location.hash="browse";else render();return;}
  if(t.dataset.view){S.mapView=t.dataset.view;S.pin="";render();return;}
  if(t.dataset.st){S.hide[t.dataset.st]=!S.hide[t.dataset.st];render();return;}
  if(t.dataset.city){S.city=t.dataset.city;S.area="";render();return;}
  if(t.dataset.area){S.area=S.area===t.dataset.area?"":t.dataset.area;render();return;}
  if(t.dataset.go){if(e.target.closest("a,button,input"))return;location.hash=t.dataset.go;return;}
  if(t.dataset.region){S.region=t.dataset.region;try{localStorage.setItem("veev_region",S.region);}catch(_){ }render();return;}
  const a=t.dataset.act,id=t.dataset.id;
  if(a==="edit"){S.edit=!S.edit;S.msg="";render();return;}
  if(a==="esc-edit"){S.escEdit=!S.escEdit;render();return;}
  if(a==="add-comp"){S.addComp=!S.addComp;S.compEdit="";S.compPre=null;S.msg="";render();return;}
  if(a==="add-home"){S.addHome=!S.addHome;S.msg="";render();return;}
  if(a==="add-area"){S.addArea=!S.addArea;render();return;}
  if(a==="toggle-e"){S.showE=!S.showE;render();return;}
  if(a==="copy-homes"||a==="copy-comps"){const text=a==="copy-homes"?csv(S.homes,["region","address","city","hood","zip","plan","elv","scheme","hc","lot","dir","status","gf","aop","qr","list","listNote","sale","incAct","net","saleDate","coe","closeDate","fy","model","elem","high","flags","esc.buyers","esc.fin","esc.solar","esc.agent","esc.agentPhone","esc.agentEmail","esc.lender","esc.loanRep","esc.escrowCo","esc.escrowNo","esc.signAt","sf"]):csv(S.comps,["address","hood","builder","status","price","sf","lot","date","dom","near","note"]);
    try{await navigator.clipboard.writeText(text);S.msg="Copied. Paste into a sheet.";}catch(_){S.msg="Copy was blocked in this view.";}render();return;}
  if(!S.db)return;
  try{
    if(a==="toggle"){const x=S.notes.find(q=>q.id===id);if(x)await S.db.doc("notes/"+id).update({done:!x.done});}
    if(a==="gate"){await S.db.doc("homes/"+id).update({esc:{gates:{[t.dataset.k]:t.checked?today():false}}});}
    if(a==="start-esc"){await S.db.doc("homes/"+id).update({status:"Sold",saleDate:today(),esc:{solar:"TBD"}});S.escEdit=true;S.msg="Escrow started. Add the buyer and close date below.";render();}
    if(a==="close-home"){if(t.dataset.sure){await S.db.doc("homes/"+id).update({status:"Closed",closeDate:today()});}else{t.dataset.sure="1";t.textContent="Tap again to confirm close";}}
    if(a==="del-shape"){if(t.dataset.sure){await S.db.doc("shapes/"+id).delete();S.shape="";}else{t.dataset.sure="1";t.textContent="Tap again to delete";}}
    if(a==="del-area"){if(t.dataset.sure){await S.db.doc("areas/"+id).delete();S.area="";}else{t.dataset.sure="1";t.textContent="Tap again to remove";}}
    if(a==="del-note"||a==="del-comp"){if(t.dataset.sure){await S.db.doc((a==="del-note"?"notes/":"comps/")+id).delete();}else{t.dataset.sure="1";t.textContent="Delete?";t.style.color="var(--bad)";t.style.fontSize="12px";}}
  }catch(err){fail(err);}
});
document.addEventListener("change",async e=>{const t=e.target;if(!t.dataset||!S.db||!(t.dataset.ptier||t.dataset.pavoid))return;const mk=t.dataset.mk,mt=hoodMeta(mk);const pt=Object.assign({},mt.pt||{}),pa=Object.assign({},mt.pa||{});
  if(t.dataset.ptier)pt[t.dataset.ptier]=Number(t.value);if(t.dataset.pavoid)pa[t.dataset.pavoid]=t.checked;
  try{await S.db.doc("hoods/"+slug(mk)).set({name:mk,avoid:!!mt.avoid,note:mt.note||"",pt,pa,updated:today()});}catch(err){fail(err);}t.blur();render();});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target;
  if(f.id==="loginForm"){const fd0=new FormData(f);S.msg="";const {error}=await S.sb.auth.signInWithPassword({email:fd0.get("email"),password:fd0.get("password")});if(error){S.msg="That email and password didn't work.";render();}else{S.needLogin=false;S.msg="";start();}return;}
  if(f.id==="searchForm"){const q=String(new FormData(f).get("q")||"").trim();if(!q){S.found=null;render();return;}S.found={q,busy:true};render();
    try{const g=await geocode(q);if(!g)S.found={q,err:"Couldn't find that address. Add the city and try again."};else{g.q=q;g.market=marketOf(g);g.region=regionOf(g);S.found=g;}}catch(err){S.found={q,err:"Address lookup isn't responding right now. "+(err.message||"")};}
    render();return;}
  if(!S.db){fail();return;}
  if(f.id==="importForm"){try{let txt=$("imp").value.trim();const fl=$("impFile").files[0];if(!txt&&fl)txt=await fl.text();const d=JSON.parse(txt);let rows=[];["homes","notes","comps","areas","shapes","hoods"].forEach(c=>(d[c]||[]).forEach(x=>{const o=Object.assign({},x);const id=String(o.id||"");delete o.id;if(id)rows.push({coll:c,id,data:o});}));
      for(let i=0;i<rows.length;i+=100){const {error}=await S.sb.from("docs").upsert(rows.slice(i,i+100));if(error)throw error;}
      await S.db.reloadAll();S.msg="Imported "+rows.length+" records.";}catch(err){S.msg="Import failed: "+(err.message||err);}render();return;}const v=Object.fromEntries(new FormData(f).entries());
  try{
    if(f.id==="noteForm"){if(!v.text.trim())return;await S.db.collection("notes").add({home:f.dataset.id,kind:v.kind,text:v.text.trim(),date:today(),done:false});f.reset();S.msg="";}
    if(f.id==="editForm"){const u={status:v.status,flags:v.flags,zip:v.zip,elem:v.elem,high:v.high,listNote:v.listNote,hc:v.hc,saleDate:v.saleDate,closeDate:v.closeDate};
      ["list","sale","incAct","model"].forEach(key=>u[key]=n(v[key]));u.net=u.sale?u.sale-(u.incAct||0):null;
      await S.db.doc("homes/"+f.dataset.id).update(u);S.edit=false;S.msg="Saved.";render();}
    if(f.id==="areaForm"){const id=slug(v.city+"-"+v.name);const sp=x=>x.split(",").map(q=>q.trim()).filter(Boolean);
      await S.db.doc("areas/"+id).set({city:v.city.trim(),name:v.name.trim(),zips:sp(v.zips),streets:sp(v.streets),schools:v.schools.trim(),tier:Number(v.tier),model:n(v.model),note:v.note.trim()});S.city=v.city.trim();S.area=id;S.addArea=false;render();}
    if(f.id==="pxForm"){const h=homeById(f.dataset.id);const amt=n(v.v);if(!amt)return;const u={px:[...(h.px||[]),{t:v.t,v:amt,d:v.d}]};const key={"Quarterly refresh":"qr","Green Folder":"gf","AOP":"aop","List price":"list","Lot price":"acq"}[v.t];if(key)u[key]=amt;await S.db.doc("homes/"+f.dataset.id).update(u);S.msg="Price logged.";render();}
    if(f.id==="buildForm"){const b={},dn={};STAGES.forEach(([k])=>{b[k]=v["d_"+k]||"";dn[k]=!!v["c_"+k];});const u={build:b,bd:dn,cm:v.cm,pid:v.pid};if(b.hc)u.hc=b.hc;await S.db.doc("homes/"+f.dataset.id).update(u);S.msg="Build saved.";render();}
    if(f.id==="mktForm"){const c={};CH.forEach(([k])=>c[k]=!!v["ch_"+k]);const u={mktDate:v.mktDate,ch:c,mktPlan:v.mktPlan,listNote:v.listNote};if(n(v.list))u.list=n(v.list);await S.db.doc("homes/"+f.dataset.id).update(u);S.msg="Marketing saved.";render();}
    if(f.id==="escNoteForm"){if(!v.text.trim())return;await S.db.collection("notes").add({home:f.dataset.id,kind:"esc",text:v.text.trim(),date:today(),done:false});f.reset();}
    if(f.id==="hoodForm"){const name=f.dataset.name;await S.db.doc("hoods/"+slug(name)).set({name,avoid:!!v.avoid,note:(v.note||"").trim(),pt:hoodMeta(name).pt||{},pa:hoodMeta(name).pa||{},updated:today()});S.msg="Saved.";render();}
    if(f.id==="shapeForm"){const d={name:v.name.trim(),kind:v.kind,tier:Number(v.tier),note:v.note.trim()};if(S.newShape){await S.db.collection("shapes").add(Object.assign(d,{pts:S.newShape.pts,city:S.newShape.city}));S.newShape=null;}else{await S.db.doc("shapes/"+f.dataset.id).update(d);}S.shape="";render();}
    if(f.id==="homeForm"){const id=slug(v.address);if(!id)return;if(homeById(id)){S.msg="That address is already in the tracker.";render();return;}
      await S.db.doc("homes/"+id).set({region:v.region,address:v.address.trim(),city:v.city.trim(),hood:v.hood.trim(),zip:v.zip.trim(),plan:v.plan,elv:(v.plan==="E"?"Model E":v.plan+" "+v.elv.trim()).trim(),status:v.status,hc:v.hc,lot:n(v.lot),gf:n(v.gf),aop:n(v.aop),acq:n(v.acq),acqDate:v.acqDate,build:{hc:v.hc||""}});
      geocode(v.address.trim()+", "+v.city.trim()+", CA").then(g=>{if(g)S.db.doc("homes/"+id).update({lat:g.lat,lng:g.lng,zip:v.zip.trim()||g.zip,hood:v.hood.trim()||marketOf(g)});}).catch(()=>{});S.addHome=false;S.msg="Home added.";render();}
    if(f.id==="escForm"){const coe=v.coe;delete v.coe;await S.db.doc("homes/"+f.dataset.id).update({coe:coe,esc:v});S.escEdit=false;S.msg="Escrow saved.";render();}
    if(f.id==="compForm"){const id=f.dataset.id,old=id?S.comps.find(x=>x.id===id):null,pre=S.compPre||{};
      const c={address:v.address.trim(),hood:v.hood,builder:v.builder.trim(),status:v.status,price:n(v.price),sf:n(v.sf),adj:parseFloat(v.adj)||0,adjWhy:v.adjWhy.trim(),lot:n(v.lot),date:v.date,dom:n(v.dom),near:v.near,note:v.note.trim()};
      if(!old){c.added=today();if(pre.lat){c.lat=pre.lat;c.lng=pre.lng;c.zip=pre.zip;}}
      if(!(old&&old.lat&&old.address===c.address)&&!c.lat){try{const g=await geocode(c.address+(/,/.test(c.address)?"":", San Jose, CA"));if(g){c.lat=g.lat;c.lng=g.lng;c.zip=g.zip;}}catch(_){ }}
      if(old)await S.db.doc("comps/"+id).update(c);else await S.db.collection("comps").add(c);
      S.addComp=false;S.compEdit="";S.compPre=null;S.msg="Comp saved."+(c.lat||(old&&old.lat)?"":" Couldn't place it on the map; check the address.");render();}
  }catch(err){fail(err);}
});
function deep(a,b){const o=Object.assign({},a);for(const k in b){const v=b[k];o[k]=(v&&typeof v==="object"&&!Array.isArray(v)&&o[k]&&typeof o[k]==="object"&&!Array.isArray(o[k]))?deep(o[k],v):v;}return o;}
function mkdb(sb){const subs={};
  const load=async c=>{const {data,error}=await sb.from("docs").select("id,data").eq("coll",c);if(error)throw error;return {docs:data.map(r=>({id:r.id,data:()=>r.data}))};};
  const emit=async c=>{const s=subs[c];if(!s)return;try{s.cb(await load(c));}catch(e){s.err&&s.err(e);}};
  const put=async(c,id,data)=>{const {error}=await sb.from("docs").upsert({coll:c,id,data,updated_at:new Date().toISOString()});if(error)throw error;await emit(c);};
  const cur=(c,id)=>{const x=(S[c]||[]).find(q=>q.id===id);if(!x)return {};const o=Object.assign({},x);delete o.id;return o;};
  return {collection:c=>({onSnapshot:(cb,err)=>{subs[c]={cb,err};emit(c);},add:d=>put(c,(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/-/g,"").slice(0,14),d)}),
    doc:p=>{const k=p.indexOf("/"),c=p.slice(0,k),id=p.slice(k+1);return {set:d=>put(c,id,d),update:u=>put(c,id,deep(cur(c,id),u)),delete:async()=>{const {error}=await sb.from("docs").delete().eq("coll",c).eq("id",id);if(error)throw error;await emit(c);}};},
    reloadAll:()=>Promise.all(Object.keys(subs).map(emit))};}
function start(){S.ready=false;render();const db=mkdb(S.sb);S.db=db;let got=0;
  const sub=name=>db.collection(name).onSnapshot(s=>{S[name]=s.docs.map(x=>Object.assign({},x.data(),{id:x.id}));if(++got>=6)S.ready=true;S.err="";soft();},err=>{S.ready=true;S.err="Can't reach the data: "+(err.message||err)+". If this is the first run, the SQL setup script hasn't been run yet.";render();});
  ["homes","notes","comps","areas","shapes","hoods"].forEach(sub);}
(async()=>{
  try{S.base=localStorage.getItem("veev_base3")||"Streets";}catch(_){ }
  try{if(window.fetch){const r=await fetch("boundaries.json");if(r.ok){const j=await r.json();BUILTIN=(j.shapes||[]).map((x,i)=>Object.assign({id:"b"+i,kind:"hood",builtin:true},x));}}}catch(_){ }
  try{if(window.fetch){const r=await fetch("cityhoods.json");if(r.ok){CITY=(await r.json()).shapes||[];}}}catch(_){ }
  try{S.showCN=!!localStorage.getItem("veev_showCN");}catch(_){ }
  try{if(window.fetch){const r=await fetch("pockets.json");if(r.ok){POCK=(await r.json()).pockets||[];}}}catch(_){ }
  try{if(window.fetch){const r=await fetch("schools.json");if(r.ok){const j=await r.json();SCH={hs:j.hs.shapes,ds:j.districts.shapes,hsSrc:j.hs.source,dsSrc:j.districts.source};}}}catch(_){ }
  try{S.showHS=!!localStorage.getItem("veev_showHS");S.showDS=!!localStorage.getItem("veev_showDS");}catch(_){ }
  if(!window.supabase){S.ready=true;S.err="The database library didn't load.";render();return;}
  S.sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  const {data}=await S.sb.auth.getSession();
  if(!data||!data.session){S.needLogin=true;S.ready=true;render();return;}
  start();
})();
