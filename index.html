<style>
/* Layout idea: one ledger grid used everywhere. Dashboard = work queue by task, then the same per-home table. Detail = stacked label/value sections. */
:root{
  --mint:#A6F5AE; --seafoam:#CAF2CE; --ice:#E7E9EC; --cloud:#F7F8F8; --frost:#DFEAE0;
  --sand:#C7C8BA; --slate:#8D988E; --olive:#9A9C83; --charcoal:#2B2B2B; --graphite:#3D3D3D;
  --warn-bg:#F6E7DA; --warn:#9A4A12; --bad:#A3271F; --good:#1F6B2B;
  --body:"Instrument Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--cloud);color:var(--charcoal);font-family:var(--body);font-size:15px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
header{background:var(--charcoal);color:#fff;padding:14px 16px 0;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:18px;letter-spacing:.14em;font-weight:700}
.brand span{color:var(--sand);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
nav{display:flex;margin-top:10px;overflow-x:auto}
nav a{color:var(--sand);text-decoration:none;padding:9px 14px 10px;font-weight:600;font-size:14px;border-bottom:3px solid transparent;white-space:nowrap}
nav a.on{color:#fff;border-bottom-color:var(--mint)}
main{max-width:1320px;margin:0 auto;padding:14px 16px 80px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chipbtn{border:1px solid var(--sand);background:#fff;padding:6px 11px;border-radius:2px;font-size:13px;font-weight:500;cursor:pointer}
.chipbtn.on{background:var(--charcoal);color:#fff;border-color:var(--charcoal)}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--sand);border:1px solid var(--sand);margin-bottom:6px}
.tile{background:#fff;padding:9px 10px}
.tile i{display:block;font-style:normal;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--slate)}
.tile b{font-size:19px;font-weight:600}
h2{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite);margin:24px 0 6px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small{font-weight:500;color:var(--slate);letter-spacing:.04em;text-transform:none}
.q{background:#fff;border-top:2px solid var(--charcoal)}
.qh{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;background:var(--frost)}
.qh.now{background:var(--charcoal);color:#fff}
.ql{display:grid;grid-template-columns:minmax(150px,34%) 1fr;gap:4px 14px;padding:9px 10px;border-bottom:1px solid var(--ice)}
.ql b{font-weight:600}
.ql span a{white-space:nowrap;margin-right:10px}
.clear{padding:10px;background:var(--seafoam);font-weight:600}
.quiet{padding:9px 10px;color:var(--graphite);background:#fff;border-bottom:1px solid var(--ice)}
.tw{overflow-x:auto;background:#fff;border-top:2px solid var(--charcoal)}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--slate);text-align:left;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--sand);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--ice);vertical-align:top}
td.r,th.r{text-align:right}
tr[data-go]{cursor:pointer}
tr[data-go]:hover td{background:var(--frost)}
tr.grp td{background:var(--ice);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px}
td .sm{display:block;font-size:12px;color:var(--graphite)}
.st{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:2px;white-space:nowrap}
.st.Listed{background:var(--mint)} .st.Sold{background:var(--charcoal);color:#fff} .st.Closed{background:var(--slate);color:#fff}
.st.Planned,.st.Built{border:1px solid var(--sand);color:var(--graphite)} .st.Pulled{background:var(--warn-bg);color:var(--warn)}
.over{color:var(--bad);font-weight:600} .under{color:var(--good);font-weight:600} .mute{color:var(--slate)}
.pb{display:inline-block;width:64px;height:8px;background:var(--ice);vertical-align:middle;margin-right:6px}
.pb i{display:block;height:100%;background:var(--good)}
.back{display:inline-block;margin-bottom:8px;color:var(--graphite);font-weight:600;text-decoration:none}
h1{font-size:24px;margin:0 0 4px;font-weight:700;text-wrap:balance}
.sub{color:var(--graphite);margin-bottom:4px}
dl{margin:0;background:#fff;border-top:2px solid var(--charcoal);display:grid;grid-template-columns:1fr 1fr}

.btn{background:var(--charcoal);color:#fff;border:0;padding:9px 14px;border-radius:2px;font-weight:600;cursor:pointer}
.btn.ghost{background:#fff;color:var(--charcoal);border:1px solid var(--charcoal)}
.btn.sm{padding:5px 9px;font-size:12px}
.btn:focus-visible,.chipbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--good);outline-offset:1px}
form.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;background:var(--ice);padding:10px}
form.grid label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--graphite);display:flex;flex-direction:column;gap:3px}
form.grid .wide{grid-column:1/-1}
input,select,textarea{border:1px solid var(--sand);background:#fff;padding:8px;border-radius:2px;width:100%;font-size:15px;text-transform:none;letter-spacing:0}
textarea{min-height:60px;resize:vertical}
.gates{background:#fff;display:grid;grid-template-columns:1fr 1fr}
.gate{display:flex;gap:9px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--ice)}
.gate.done span{color:var(--slate)} .gate.na span{color:var(--sand);text-decoration:line-through}
input[type=checkbox]{width:18px;height:18px;flex:none;padding:0}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.note{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border-bottom:1px solid var(--ice);background:#fff}
.note p{margin:0;flex:1}
.note time{font-size:11px;color:var(--slate);white-space:nowrap}
.note.done p{text-decoration:line-through;color:var(--slate)}
.x{border:0;background:none;color:var(--slate);cursor:pointer;font-size:16px;padding:0 4px}
.kind{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;padding:6px 10px;background:var(--frost)}
.kind.against{background:var(--warn-bg);color:var(--warn)} .kind.read{background:var(--charcoal);color:#fff}
details{margin-top:26px;background:#fff;border-top:2px solid var(--slate)}
summary{cursor:pointer;padding:10px;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--graphite)}
details .tw{border-top:1px solid var(--sand)}
.gate small{color:var(--slate);margin-left:6px}
.mapw{overflow-x:auto;border-top:2px solid var(--charcoal);background:#fff;padding:10px}
.map{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:4px;min-width:760px}
.blk{border:0;text-align:left;padding:7px 8px;min-height:74px;cursor:pointer;border-radius:2px;display:flex;flex-direction:column;justify-content:space-between;font-size:12px;line-height:1.25}
.blk b{font-weight:600}.blk span{font-size:11px;opacity:.9}
.blk.sel{outline:3px solid var(--charcoal);outline-offset:1px}
.t1{background:#1F6B2B;color:#fff}.t2{background:#3F8F4A;color:#fff}.t3{background:#7FC489}.t4{background:#B9E8BE}.t5{background:#DFEAE0}.t6{background:#EDEEEA}
.legend{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0;font-size:11px;align-items:center}
.legend i{display:inline-block;padding:3px 8px;font-style:normal;border-radius:2px}
.compass{font-size:11px;color:var(--slate);display:flex;justify-content:space-between;min-width:760px;padding:0 2px 6px}
.mapbox{background:#fff;border-top:2px solid var(--charcoal);padding:8px;max-width:720px}
.mapbox.small{max-width:380px}
.sw{display:inline-block;width:11px;height:11px;border:1px solid var(--charcoal);margin-right:5px;vertical-align:-1px}
.chipbtn.off{opacity:.45;text-decoration:line-through}
.pincard{background:#fff;border:1px solid var(--sand);padding:9px 10px;margin-top:8px;max-width:720px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.split{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
.side{position:sticky;top:104px}
@media(max-width:900px){.split{grid-template-columns:1fr}.side{position:static;order:-1}}
.stg td{padding:6px 10px}.stg input[type=date]{padding:5px;width:150px}
.banner{background:var(--warn-bg);color:var(--warn);padding:8px 12px;margin-bottom:12px;font-size:13px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.msg{font-size:13px;color:var(--good)}
@media(max-width:600px){.tiles{grid-template-columns:repeat(3,1fr)}dl,.gates,.cols{grid-template-columns:1fr}.ql{grid-template-columns:1fr}}
.lmap{height:calc(100vh - 190px);min-height:420px;background:var(--cloud)}
@media(max-width:900px){.lmap{height:340px;min-height:0}}
.mapbox{max-width:none}
.split{grid-template-columns:minmax(0,1fr) minmax(400px,44%)}
.lmap.sm{height:300px;min-height:0}
.shp{background:transparent;border:0;box-shadow:none;font:600 11px "Instrument Sans",sans-serif;color:#2B2B2B;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.pinlab{background:#fff;border:1px solid #2B2B2B;border-radius:0;box-shadow:none;font:500 11px "Instrument Sans",sans-serif;padding:1px 4px}
.login{max-width:340px;margin:60px auto}
</style>

<script>

ROADS.forEach(r=>{const d=[];for(let i=0;i<r.p.length-1;i++)for(let k=0;k<10;k++)d.push([r.p[i][0]+(r.p[i+1][0]-r.p[i][0])*k/10,r.p[i][1]+(r.p[i+1][1]-r.p[i][1])*k/10]);d.push(r.p[r.p.length-1]);r.d=d;});
const PLACES=[["San Jose",37.335,-121.89],["Sunnyvale",37.369,-122.036],["Cupertino",37.323,-122.032],["Los Gatos",37.226,-121.975],["Milpitas",37.432,-121.90],["Fremont",37.548,-121.989],["Newark",37.517,-122.06],["Union City",37.593,-122.045],["Hayward",37.668,-122.085],["Castro Valley",37.705,-122.085],["Pleasanton",37.66,-121.875],["Danville",37.822,-122.0],["Alamo",37.85,-122.03],["Walnut Creek",37.906,-122.065],["Lafayette",37.886,-122.118],["Oakland",37.80,-122.27],["Palo Alto",37.44,-122.14],["Mountain View",37.386,-122.083],["Redwood City",37.485,-122.236],["San Mateo",37.563,-122.325],["Morgan Hill",37.13,-121.654],["Willow Glen",37.305,-121.90,1],["Cambrian",37.258,-121.93,1],["Almaden",37.215,-121.86,1],["Evergreen",37.318,-121.80,1],["Blossom Valley",37.247,-121.835,1],["Santa Teresa",37.23,-121.78,1],["Rose Garden",37.334,-121.925,1],["Campbell",37.287,-121.952,1],["Downtown",37.337,-121.888,1]];
const COL={Listed:"#A6F5AE",Sold:"#2B2B2B",Closed:"#8D988E",Planned:"#FFFFFF",Pulled:"#E08A3C",Built:"#C7C8BA"};
const VIEWS={bay:{l:"Greater Bay",s:37.20,n:37.95,w:-122.30,e:-121.70},sj:{l:"San Jose",s:37.215,n:37.345,w:-121.965,e:-121.765}};
const STAGES=[["start","Start (trench)"],["fnd","Foundation complete"],["asm","Assembly complete"],["fin","Finishes complete"],["pge","PG&E meter set"],["co","Certificate of occupancy"],["qc","QC punch"],["hc","Home complete"]];
const CH=[["mls","MLS"],["zillow","Zillow"],["showcase","Zillow Showcase"],["site","Veev site"],["off","Off-market"]];
const RB={"South Bay":{s:37.18,n:37.45,w:-122.10,e:-121.72},"East Bay":{s:37.48,n:37.96,w:-122.20,e:-121.86}};
function stage(h){const b=h.build||{},d=h.bd||{};let last="",next="";for(const [k,l] of STAGES){if(d[k])last=l;else if(!next&&b[k])next=l+" "+fd(b[k]);}return {last,next};}
const chans=h=>CH.filter(c=>(h.ch||{})[c[0]]).map(c=>c[1]).join(", ");
const SUPA_URL="https://ewtpfifjfbhjqelywnpm.supabase.co",SUPA_KEY="sb_publishable_dcO-Mn03vWxXZurRfK2LOQ_3T2Sq9AQ";
const TIER={1:"#1F6B2B",2:"#3F8F4A",3:"#7FC489",4:"#B9E8BE",5:"#DFEAE0",6:"#EDEEEA"};
const S={shapes:[],shape:"",newShape:null,base:"Light",bRegion:"",bCity:"",bTab:"inv",mapView:"bay",hide:{},showE:false,pin:"",homes:[],notes:[],comps:[],ready:false,db:null,err:"",region:"South Bay",edit:false,escEdit:false,addComp:false,addHome:false,eOpen:false,areas:[],city:"San Jose",area:"",addArea:false,msg:""};

const $=id=>document.getElementById(id);

const d=s=>{if(!s)return null;const t=new Date(s+"T12:00:00");return isNaN(t)?null:t;};
const fd=s=>{const t=d(s);return t?t.toLocaleDateString("en-US",{month:"short",day:"numeric",year:"2-digit"}):"–";};
const days=s=>{const t=d(s);return t?Math.round((t-new Date())/864e5):null;};
const today=()=>{const t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");};

function gap(h){const a=n(h.sale)||n(h.list)||n(h.gf),mv=n(h.model);if(!a||!mv)return `<span class="mute">–</span>`;const g=(a-mv)/mv*100;const c=g>4?"over":g<-4?"under":"mute";return `<span class="${c} num">${g>0?"+":""}${g.toFixed(0)}%</span>`;}
function mxEq(c){const p=n(c.price),sf=n(c.sf);if(!p||!sf)return null;return p/sf*Math.pow(MX_SF/sf,ELAST)*MX_SF;}

/* escrow */
function prog(h){const e=h.esc||{},g=e.gates||{};const cash=e.fin==="Cash";
  const list=GATES.map(([k,l])=>{const na=cash&&CASH_NA.includes(k);let done=!!g[k];const at=typeof g[k]==="string"?g[k]:"";if(k==="contract"&&h.saleDate)done=true;if(k==="solar"&&(e.solar==="Own"||e.solar==="Lease"||e.solar==="None"))done=true;return {k,l,na,done,at};});
  const app=list.filter(x=>!x.na);const dn=app.filter(x=>x.done).length;const nx=app.find(x=>!x.done);
  return {list,done:dn,total:app.length,next:nx?nx.l:""};}
function bar(p){return `<span class="pb"><i style="width:${Math.round(p.done/p.total*100)}%"></i></span><span class="num">${p.done}/${p.total}</span>`;}
function nextText(h){
  if(h.status==="Sold"){const p=prog(h);return bar(p)+`<span class="sm">${h.coe?"Closes "+fd(h.coe):"Set close date"}${p.next?" · next: "+esc(p.next):" · ready to close"}</span>`;}

  if(h.status==="Listed")return (dd==null?"Listed":dd<=0?`Listed · ${-dd} days past completion`:`Listed · completes in ${dd} days`)+`<span class="sm">${esc(chans(h)||h.listNote||"Channels not set")}</span>`;

}

function route(){return (location.hash||"#dashboard").slice(1);}

function banner(){return S.err?`<div class="banner">${esc(S.err)}</div>`:"";}

/* the one home table, used on Dashboard and Homes */
function homeRow(h){return `<tr data-go="home-${esc(h.id)}"><td><b>${esc(h.address)}</b><span class="sm">${esc(h.hood||h.city||"")}${S.region==="All"?" · "+esc(h.region):""}</span></td><td><span class="st ${esc(h.status)}">${esc(h.status)}</span></td><td>${esc((h.elv||"").replace(/^X /,""))}<span class="sm num">${h.lot?Number(h.lot).toLocaleString()+" sf lot":""}</span></td><td class="num">${fd(h.hc)}</td><td class="r num"><b>${m(price(h))}</b><span class="sm">${n(h.net)||n(h.sale)?"sold":n(h.list)?"list":"Green Folder"}</span></td><td class="r">${gap(h)}</td><td>${nextText(h)}</td></tr>`;}
function homeTable(hs,grouped){
  const head=`<tr><th>Home</th><th>Status</th><th>Plan</th><th>Complete</th><th class="r">Price</th><th class="r">vs model</th><th>Progress and next step</th></tr>`;
  if(!hs.length)return `<div class="quiet">No homes here yet.</div>`;
  let body="";
  if(grouped){const g={};hs.forEach(h=>{const k=h.hood||h.city||"Other";(g[k]=g[k]||[]).push(h);});
    Object.keys(g).sort().forEach(k=>{const tot=g[k].reduce((t,h)=>t+(n(h.gf)||0),0);body+=`<tr class="grp"><td colspan="7">${esc(k)} · ${g[k].length} homes${tot?" · $"+(tot/1e6).toFixed(2)+"M Green Folder":""}</td></tr>`+g[k].map(homeRow).join("");});
  }else body=hs.map(homeRow).join("");
  return `<div class="tw"><table>${head}${body}</table></div>`;
}
const sortHomes=hs=>[...hs].sort((a,b)=>(ORDER[a.status]-ORDER[b.status])||(a.hc||"9").localeCompare(b.hc||"9"));

function queue(hs){
  const now=[],soon=[];const add=(arr,t,h,x)=>arr.push({t,h,x:x||""});
  hs.forEach(h=>{const dd=days(h.hc);
    if(h.status==="Sold"){const p=prog(h),dc=days(h.coe);
      if(!h.coe)add(now,"Set the estimated close date",h);
      else if(p.next){if(dc<=14)add(now,p.next,h,"closes "+fd(h.coe));else if(dc<=45)add(soon,p.next,h,"closes "+fd(h.coe));}
      else if(dc<=14)add(now,"Ready to close",h,fd(h.coe));
      const e=h.esc||{};if(e.signAt){const ds=days(e.signAt.slice(0,10));if(ds!=null&&ds>=0&&ds<=14)add(ds<=3?now:soon,"Signing appointment",h,fd(e.signAt.slice(0,10))+" "+e.signAt.slice(11,16));}
      if(h.coe&&dc<=45&&(h.pge||{}).status!=="Permanent power on")add(dc<=14?now:soon,"Permanent power needed before close",h,(h.pge||{}).status||"PG&E not started");}
    else if(h.status==="Pulled")add(now,"Pulled from market: decide on relist",h);
    else if(h.status==="Listed"&&dd!=null&&dd<=-30)add(now,"Listed 30+ days past completion: review price",h,(-dd)+"d");
    else if(h.status==="Planned"&&dd!=null&&dd<0)add(now,"Complete but not listed",h);
    else if(h.status==="Planned"&&dd!=null&&dd<=45)add(soon,"Completing within 45 days: prep the listing",h,fd(h.hc));
  });
  const lines=arr=>{const g={};arr.forEach(i=>(g[i.t]=g[i.t]||[]).push(i));return Object.keys(g).map(t=>`<div class="ql"><b>${esc(t)}</b><span>${g[t].map(i=>link(i.h)+(i.x?` <small class="mute">${esc(i.x)}</small> `:" ")).join("")}</span></div>`).join("");};
  return {now,soon,nowHtml:lines(now),soonHtml:lines(soon)};
}
function viewDashboard(){
  const hs=live();const by=s=>hs.filter(h=>h.status===s).length;
  const openGF=hs.filter(h=>h.status!=="Closed"&&h.status!=="Sold").reduce((t,h)=>t+(n(h.gf)||0),0);
  const q=queue(hs);const todos=S.notes.filter(x=>x.kind==="todo"&&!x.done&&(!x.home||(homeById(x.home)&&inRegion(homeById(x.home)))));
  const later=hs.filter(h=>h.status==="Planned"&&days(h.hc)>45);
  let o=banner()+filters();
  o+=`<div class="tiles"><div class="tile"><i>Listed</i><b class="num">${by("Listed")+by("Pulled")}</b></div><div class="tile"><i>In escrow</i><b class="num">${by("Sold")}</b></div><div class="tile"><i>Closed</i><b class="num">${by("Closed")}</b></div><div class="tile"><i>Planned</i><b class="num">${by("Planned")}</b></div><div class="tile"><i>Unsold Green Folder</i><b class="num">${openGF?"$"+(openGF/1e6).toFixed(1)+"M":"–"}</b></div></div>`;
  o+=`<h2>Work queue <small>${q.now.length} do now · ${q.soon.length} coming up · ${todos.length} to-dos</small></h2><div class="q">`;
  if(!q.now.length&&!q.soon.length&&!todos.length)o+=`<div class="clear">All clear. Nothing due in the next 45 days.</div>`;
  if(q.now.length)o+=`<div class="qh now">Do now</div>`+q.nowHtml;
  if(q.soon.length)o+=`<div class="qh">Coming up, next 45 days</div>`+q.soonHtml;
  if(todos.length)o+=`<div class="qh">Your to-dos</div>`+todos.map(noteRow).join("");
  if(later.length){const last=later.map(h=>h.hc).sort().pop();o+=`<div class="quiet">No rush: ${later.length} planned homes complete after 45 days, through ${fd(last)}.</div>`;}
  o+=`</div>`;
  const mk=sortHomes(hs.filter(h=>h.status==="Listed"||h.status==="Pulled")),es=hs.filter(h=>h.status==="Sold");
  const top=`<h2>On the market <small>${mk.length} homes</small></h2>`+homeTable(mk,false)+`<h2>In escrow <small>${es.length} homes</small></h2>`+(es.length?homeTable(es,false):`<div class="quiet">Nothing in escrow.</div>`);
  const i=o.indexOf("<h2>Work queue");
  return `<div class="split"><div>${o.slice(0,i)+top+o.slice(i)}</div><div class="side"><div class="mapbox">${mapSvg(mapHomes(),S.region==="East Bay"?RB["East Bay"]:S.region==="South Bay"?RB["South Bay"]:VIEWS.bay,false)}</div>${legend()}</div></div>`;
}
function eTable(es){return `<div class="tw"><table><tr><th>Home</th><th>Status</th><th class="r">Sale price</th><th class="r">$/sf</th><th>Sold</th><th class="r">Lot</th><th>Notes</th></tr>`+es.map(h=>{const p=n(h.sale)||n(h.list),sf=n(h.sf);return `<tr data-go="home-${esc(h.id)}"><td><b>${esc(h.address)}</b><span class="sm">${esc([h.city,h.zip].filter(Boolean).join(" "))}${h.hood?" · "+esc(h.hood):""}</span></td><td><span class="st ${esc(h.status)}">${esc(h.status)}</span></td><td class="r num"><b>${m(p)}</b>${!n(h.sale)&&n(h.list)?`<span class="sm">list</span>`:""}</td><td class="r num">${p&&sf?"$"+Math.round(p/sf).toLocaleString():"–"}</td><td class="num">${fd(h.saleDate)}</td><td class="r num">${h.lot?Number(h.lot).toLocaleString():"–"}</td><td><span class="sm">${esc(h.flags||"")}</span></td></tr>`;}).join("")+`</table></div>`;}

function areaHomes(a){const z=a.zips||[],st=a.streets||[];return S.homes.filter(h=>{if(!z.includes(String(h.zip||"")))return false;const hit=x=>(x.streets||[]).some(k=>String(h.address).toLowerCase().includes(k.toLowerCase()));if(st.length)return hit(a);return !S.areas.some(o=>o.id!==a.id&&(o.zips||[]).includes(String(h.zip))&&hit(o));});}
function viewAreas(){
  const cities=[...new Set(S.areas.map(a=>a.city))].sort((a,b)=>a==="San Jose"?-1:b==="San Jose"?1:a.localeCompare(b));

  if(placed.length){const rows=Math.max(...placed.map(a=>a.row))+1;let cells="";
    for(let r=0;r<rows;r++)for(let c=0;c<7;c++){const a=placed.find(x=>x.row===r&&x.col===c);
      cells+=a?`<button class="blk t${a.tier||5} ${S.area===a.id?"sel":""}" data-area="${esc(a.id)}" style="grid-column:${c+1};grid-row:${r+1}"><b>${esc(a.name)}</b><span class="num">${n(a.model)?m(a.model)+" · ":""}${areaHomes(a).filter(focus).length} X</span></button>`:"";}

  o+=`<div class="legend">Value tier ${[1,2,3,4,5,6].map(t=>`<i class="t${t}">${t}${t===1?" top":t===6?" entry":""}</i>`).join("")} <span class="mute">Dollar figure is the calibrated Model X value. Count is Model X homes there.</span></div>`;
  const a=as.find(x=>x.id===S.area);
  if(a){const hs=areaHomes(a).sort((x,y)=>(ORDER[x.status]-ORDER[y.status]));
    o+=`<h2>${esc(a.name)} <small>tier ${esc(a.tier)}</small></h2><dl>${row("ZIPs",esc((a.zips||[]).join(", ")||"–"))}${row("Model X value",full(a.model))}${row("Schools",esc(a.schools||"–"),1)}${(a.streets||[]).length?row("Defined by streets",esc(a.streets.join(", ")),1):""}${a.note?row("Notes",esc(a.note),1):""}</dl>`;
    o+=hs.length?`<div class="tw" style="margin-top:8px"><table><tr><th>Home</th><th>Model</th><th>Status</th><th class="r">Price</th><th class="r">$/sf</th><th>Sold</th></tr>`+hs.map(h=>{const p=price(h),sf=n(h.sf)||(focus(h)?MX_SF:null);return `<tr data-go="home-${esc(h.id)}"><td><b>${esc(h.address)}</b></td><td>${esc(focus(h)?(h.elv||"X"):"Model E")}</td><td><span class="st ${esc(h.status)}">${esc(h.status)}</span></td><td class="r num"><b>${m(p)}</b><span class="sm">${n(h.net)||n(h.sale)?"sold":n(h.list)?"list":"Green Folder"}</span></td><td class="r num">${p&&sf?"$"+Math.round(p/sf).toLocaleString():"–"}</td><td class="num">${fd(h.saleDate)}</td></tr>`;}).join("")+`</table></div>`:`<div class="quiet">No Veev homes matched to this area yet.</div>`;

  o+=`<h2>Official boundary lookups</h2><div class="quiet">This map is a schematic. For the legal lines use: <a href="https://cuhsd.org/apps/pages/DistrictFreeZones">Campbell Union High boundaries</a> · <a href="https://www.esuhsd.org/Community/Boundaries/Boundary-Changes/">East Side Union High boundaries</a> · each elementary district's address locator · the City of San José public GIS map for neighborhoods, zoning and city limits.</div>`;

let MAPN=0,MAPS=[],MAPCFG={};

function mountMaps(){
  MAPS.forEach(m=>{try{m.remove();}catch(_){ }});MAPS=[];
  if(!window.L)return;
  document.querySelectorAll(".lmap").forEach(el=>{const cfg=MAPCFG[el.id];if(!cfg)return;
    const map=L.map(el,{zoomSnap:0.25,attributionControl:true});MAPS.push(map);
    const bases={"Streets":L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"&copy; OpenStreetMap"}),
      "Light":L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",{maxZoom:20,subdomains:"abcd",attribution:"&copy; OpenStreetMap &copy; CARTO"}),
      "Satellite":L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Imagery &copy; Esri"})};
    (bases[S.base]||bases.Light).addTo(map);L.control.layers(bases,null,{collapsed:true,position:"topright"}).addTo(map);map.attributionControl.setPrefix(false);
    map.on("baselayerchange",e=>{S.base=e.name;try{localStorage.setItem("veev_base2",e.name);}catch(_){ }});
    const b=cfg.b;const pts=cfg.ids.map(homeById).filter(Boolean).map(ll).filter(Boolean);
    if(pts.length&&!cfg.opt.small)map.fitBounds(L.latLngBounds(pts),{padding:[36,36],maxZoom:15});else map.fitBounds([[b.s,b.w],[b.n,b.e]]);
    const rad=x=>{const z=map.getZoom();return (z<10?3:z<11?4:z<12?5:z<13.5?6:8)-(x?0:1.5);};const marks=[];
    map.on("zoomend",()=>marks.forEach(([mk,x])=>mk.setRadius(rad(x))));

        const school=x.kind==="school";const pg=L.polygon(x.pts,school?{color:"#2B2B2B",weight:2.5,dashArray:"6 5",fill:false}:{color:"#2B2B2B",weight:1,fillColor:TIER[x.tier]||TIER[5],fillOpacity:0.45}).addTo(map);

        pg.on("click",()=>{if(map.pm&&(map.pm.globalDrawModeEnabled()||map.pm.globalEditModeEnabled()||map.pm.globalRemovalModeEnabled()))return;S.shape=x.id;S.newShape=null;render();});
        pg.on("pm:edit",async e=>{try{await S.db.doc("shapes/"+x.id).update({pts:e.layer.getLatLngs()[0].map(q=>[+q.lat.toFixed(6),+q.lng.toFixed(6)])});}catch(err){fail(err);}});});
      if(map.pm&&cfg.opt.draw){map.pm.addControls({position:"topleft",drawMarker:false,drawCircleMarker:false,drawPolyline:false,drawRectangle:false,drawCircle:false,drawText:false,cutPolygon:false,rotateMode:false,dragMode:false,drawPolygon:true,editMode:true,removalMode:true});
        map.on("pm:create",e=>{const pts=e.layer.getLatLngs()[0].map(q=>[+q.lat.toFixed(6),+q.lng.toFixed(6)]);e.layer.remove();S.newShape={pts,city:cfg.opt.city||""};S.shape="";render();const f=$("s-name");if(f)f.focus();});
        map.on("pm:remove",async e=>{if(e.layer._sid){try{await S.db.doc("shapes/"+e.layer._sid).delete();}catch(err){fail(err);}}});}
      if(S.newShape)L.polygon(S.newShape.pts,{color:"#E08A3C",weight:2,dashArray:"4 4"}).addTo(map);}

      marks.push([mk,x]);mk.on("click",()=>{location.hash="home-"+h.id;});});
  });}

  const put=async(c,id,data)=>{const {error}=await sb.from("docs").upsert({coll:c,id,data,updated_at:new Date().toISOString()});if(error)throw error;await emit(c);};
  const cur=(c,id)=>{const x=(S[c]||[]).find(q=>q.id===id);if(!x)return {};const o=Object.assign({},x);delete o.id;return o;};
  return {collection:c=>({onSnapshot:(cb,err)=>{subs[c]={cb,err};emit(c);},add:d=>put(c,(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()).replace(/-/g,"").slice(0,14),d)}),
    doc:p=>{const k=p.indexOf("/"),c=p.slice(0,k),id=p.slice(k+1);return {set:d=>put(c,id,d),update:u=>put(c,id,deep(cur(c,id),u)),delete:async()=>{const {error}=await sb.from("docs").delete().eq("coll",c).eq("id",id);if(error)throw error;await emit(c);}};},
    reloadAll:()=>Promise.all(Object.keys(subs).map(emit))};}
function start(){S.ready=false;render();const db=mkdb(S.sb);S.db=db;let got=0;
  const sub=name=>db.collection(name).onSnapshot(s=>{S[name]=s.docs.map(x=>Object.assign({},x.data(),{id:x.id}));if(++got>=5)S.ready=true;S.err="";soft();},err=>{S.ready=true;S.err="Can't reach the data: "+(err.message||err)+". If this is the first run, the SQL setup script hasn't been run yet.";render();});
  ["homes","notes","comps","areas","shapes"].forEach(sub);}
(async()=>{
  try{S.base=localStorage.getItem("veev_base2")||"Light";}catch(_){ }
  if(!window.supabase){S.ready=true;S.err="The database library didn't load.";render();return;}
  S.sb=window.supabase.createClient(SUPA_URL,SUPA_KEY);
  const {data}=await S.sb.auth.getSession();
  if(!data||!data.session){S.needLogin=true;S.ready=true;render();return;}
  start();
})();
</script>
